<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Video-Thumbnailer app icon (master). Original artwork, AGPL-3.0-only like the project. -->
  <defs>
    <linearGradient id="film" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2D3340"/>
      <stop offset="1" stop-color="#171A21"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7DD3FC"/>
      <stop offset="1" stop-color="#3B9EEA"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FDBA4D"/>
      <stop offset="1" stop-color="#F26B1D"/>
    </linearGradient>
  </defs>
  <!-- film body -->
  <rect x="16" y="16" width="480" height="480" rx="104" fill="url(#film)"/>
  <rect x="20" y="20" width="472" height="472" rx="100" fill="none" stroke="#4A5366" stroke-opacity="0.9" stroke-width="8"/>
  <!-- sprocket holes -->
  <g fill="#0C0E12">
    <rect x="42" y="84"  width="34" height="40" rx="9"/>
    <rect x="42" y="160" width="34" height="40" rx="9"/>
    <rect x="42" y="236" width="34" height="40" rx="9"/>
    <rect x="42" y="312" width="34" height="40" rx="9"/>
    <rect x="42" y="388" width="34" height="40" rx="9"/>
    <rect x="436" y="84"  width="34" height="40" rx="9"/>
    <rect x="436" y="160" width="34" height="40" rx="9"/>
    <rect x="436" y="236" width="34" height="40" rx="9"/>
    <rect x="436" y="312" width="34" height="40" rx="9"/>
    <rect x="436" y="388" width="34" height="40" rx="9"/>
  </g>
  <!-- 3x3 thumbnail grid -->
  <g fill="url(#tile)">
    <rect x="102" y="102" width="92" height="92" rx="14"/>
    <rect x="210" y="102" width="92" height="92" rx="14"/>
    <rect x="318" y="102" width="92" height="92" rx="14"/>
    <rect x="102" y="210" width="92" height="92" rx="14"/>
    <rect x="318" y="210" width="92" height="92" rx="14"/>
    <rect x="102" y="318" width="92" height="92" rx="14"/>
    <rect x="210" y="318" width="92" height="92" rx="14"/>
    <rect x="318" y="318" width="92" height="92" rx="14"/>
  </g>
  <!-- centre frame with play symbol -->
  <rect x="210" y="210" width="92" height="92" rx="14" fill="url(#hero)"/>
  <path d="M243 232 L281 256 L243 280 Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round"/>
</svg>
