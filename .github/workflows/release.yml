name: Release

# Builds self-contained single-file binaries for all platforms, plus (all unsigned)
#   Windows: Inno Setup installer  Video-Thumbnailer-<version>-win-<arch>-setup.exe
#   Linux:   AppImage              Video-Thumbnailer-<version>-linux-<arch>.AppImage
#   macOS:   DMG with the .app     Video-Thumbnailer-<version>-osx-<arch>.dmg
# Runs on tags like v0.1.0 (creates a GitHub release) or manually (artifacts only).
# Files are named Video-Thumbnailer-<version>-<rid>.zip (manual runs: version 0.0.0-dev).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          # smoke: the runner can start this build (installs/opens the package and runs vthumb --version)
          - rid: win-x64
            os: windows-latest
            arch: x64
            smoke: true
          - rid: win-arm64
            os: windows-latest
            arch: arm64
          - rid: linux-x64
            os: ubuntu-latest
            arch: x86_64
            smoke: true
          - rid: linux-arm64
            os: ubuntu-latest
            arch: aarch64
          - rid: osx-x64
            os: macos-latest
            arch: x64
          - rid: osx-arm64
            os: macos-latest
            arch: arm64
            smoke: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          [[ "$GITHUB_REF_TYPE" == "tag" ]] || VERSION="0.0.0-dev"
          NAME="Video-Thumbnailer-${VERSION}-${{ matrix.rid }}"
          OUT="dist/$NAME"
          for p in src/VideoThumbnailer.Gui src/VideoThumbnailer.Cli; do
            dotnet publish "$p" -c Release -r ${{ matrix.rid }} --self-contained \
              -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true \
              -p:EnableCompressionInSingleFile=true -p:DebugType=none \
              -p:Version="${VERSION%%-*}" -p:InformationalVersion="$VERSION" -o "$OUT"
          done
          cp LICENSE README.md "$OUT/"
          { echo "VERSION=$VERSION"; echo "NAME=$NAME"; } >> "$GITHUB_ENV"
          cd dist
          if command -v zip > /dev/null; then zip -qr "$NAME.zip" "$NAME"
          else 7z a -tzip "$NAME.zip" "$NAME" > /dev/null; fi

      - name: Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; if ($LASTEXITCODE) { exit 1 } }
          $numeric = ($env:VERSION -split '-')[0]
          & $iscc /Q "/DAppVersion=$env:VERSION" "/DNumericVersion=$numeric" "/DArch=${{ matrix.arch }}" `
            "/DSourceDir=$pwd\dist\$env:NAME" "/DOutputDir=$pwd\dist" "/DOutputBase=$env:NAME-setup" packaging\windows\installer.iss
          if ($LASTEXITCODE) { exit 1 }
      - name: Windows installer smoke test
        if: runner.os == 'Windows' && matrix.smoke
        shell: pwsh
        run: |
          $dir = "$env:RUNNER_TEMP\vt-install"
          $p = Start-Process -Wait -PassThru "dist\$env:NAME-setup.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/CURRENTUSER', '/NORESTART', "/DIR=$dir"
          if ($p.ExitCode) { throw "setup exit code $($p.ExitCode)" }
          if (-not (Test-Path "$dir\VideoThumbnailer.exe")) { throw "VideoThumbnailer.exe missing" }
          $lnk = Get-ChildItem "$env:APPDATA\Microsoft\Windows\Start Menu\Programs" -Recurse -Filter 'Video-Thumbnailer.lnk'
          if (-not $lnk) { throw "Start menu entry missing" }
          & "$dir\vthumb.exe" --version
          if ($LASTEXITCODE) { exit 1 }
          $u = Start-Process -Wait -PassThru "$dir\unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES'
          if ($u.ExitCode) { throw "uninstall exit code $($u.ExitCode)" }

      - name: AppImage
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/appimagetool" https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x "$RUNNER_TEMP/appimagetool"
          APPIMAGETOOL="$RUNNER_TEMP/appimagetool" packaging/linux/make-appimage.sh "dist/$NAME" ${{ matrix.arch }} "dist/$NAME.AppImage"
      - name: AppImage smoke test
        if: runner.os == 'Linux' && matrix.smoke
        run: |
          "dist/$NAME.AppImage" --appimage-extract-and-run vthumb --version

      - name: macOS app and DMG
        if: runner.os == 'macOS'
        run: packaging/macos/make-dmg.sh "dist/$NAME" "$VERSION" "dist/$NAME.dmg"
      - name: DMG smoke test
        if: runner.os == 'macOS' && matrix.smoke
        run: |
          set -euo pipefail
          MNT=$(mktemp -d)
          hdiutil attach -nobrowse -readonly -mountpoint "$MNT" "dist/$NAME.dmg"
          test -f "$MNT/Video-Thumbnailer.app/Contents/Resources/app.icns"
          codesign --verify --deep --strict "$MNT/Video-Thumbnailer.app"
          "$MNT/Video-Thumbnailer.app/Contents/MacOS/vthumb" --version
          hdiutil detach "$MNT"

      - uses: actions/upload-artifact@v4
        with:
          name: Video-Thumbnailer-${{ matrix.rid }}
          path: |
            dist/Video-Thumbnailer-*-${{ matrix.rid }}.zip
            dist/Video-Thumbnailer-*-${{ matrix.rid }}-setup.exe
            dist/Video-Thumbnailer-*-${{ matrix.rid }}.AppImage
            dist/Video-Thumbnailer-*-${{ matrix.rid }}.dmg

  release:
    if: github.ref_type == 'tag'
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: src
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum Video-Thumbnailer-* > checksums.sha256
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        # Works for a pushed tag as well as for a release created in the GitHub web UI.
        # Release notes come from the version's section in CHANGELOG.md (replacing what was typed in the web UI);
        # without such a section the existing/generated notes stay.
        run: |
          NOTES=(--generate-notes)
          if python3 src/tools/release-notes.py "$GITHUB_REF_NAME" src/CHANGELOG.md > notes.md; then NOTES=(--notes-file notes.md); fi
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber
            if [ "${NOTES[0]}" = --notes-file ]; then gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" "${NOTES[@]}"; fi
          else
            gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" \
              "${NOTES[@]}"
          fi
