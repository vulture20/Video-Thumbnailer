name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install ffmpeg (Linux, for integration tests)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Build
        run: dotnet build -c Release
      - name: Test
        run: dotnet test -c Release --no-build
        env:
          VTHUMB_SCREENSHOT: ${{ runner.temp }}/gui-${{ matrix.os }}.png
      # Checks the real ffmpeg download (pinned build, SHA-256 from the app, Team ID on macOS) and a sheet made with it.
      # No Mac available for manual tests, so this is the only check of the macOS download.
      - name: Smoke test with downloaded ffmpeg
        shell: bash
        env:
          VIDEO_THUMBNAILER_HOME: ${{ runner.temp }}/vthumb-home
        run: |
          set -euo pipefail
          CLI="dotnet src/VideoThumbnailer.Cli/bin/Release/net10.0/vthumb.dll"
          $CLI --lang en ffmpeg install
          FF=$(find "$VIDEO_THUMBNAILER_HOME" -type f \( -name ffmpeg -o -name ffmpeg.exe \) | head -1)
          BIN=$(dirname "$FF")
          $CLI --lang en ffmpeg status
          "$FF" -loglevel error -f lavfi -i testsrc2=size=1280x720:rate=25 -f lavfi -i sine=frequency=440 -t 20 \
            -c:v libx264 -pix_fmt yuv420p -c:a aac "$RUNNER_TEMP/smoke.mp4"
          $CLI --lang en --ffmpeg "$BIN" -o "$RUNNER_TEMP/smoke-out" "$RUNNER_TEMP/smoke.mp4"
          test -s "$RUNNER_TEMP/smoke-out/smoke.jpg"
          $CLI --lang en --ffmpeg "$BIN" -a mp4 --clip-seconds 1 -o "$RUNNER_TEMP/smoke-out" "$RUNNER_TEMP/smoke.mp4"
          test -s "$RUNNER_TEMP/smoke-out/smoke.sheet.mp4"
      - name: Upload smoke-test sheet
        uses: actions/upload-artifact@v4
        with:
          name: smoke-sheet-${{ matrix.os }}
          path: ${{ runner.temp }}/smoke-out/smoke*
          if-no-files-found: ignore
      - name: Upload GUI screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gui-screenshot-${{ matrix.os }}
          path: ${{ runner.temp }}/gui-${{ matrix.os }}.png
          if-no-files-found: ignore
